name: CI — Tests

# ─────────────────────────────────────────────────────────────────────────────
# Draait bij elke push/PR naar develop, staging of main.
# Voert geen deployment uit. Productie wordt niet aangeraakt.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

jobs:
  test:
    name: Pytest — backend
    runs-on: ubuntu-latest

    services:
      # Testdatabase — volledig geïsoleerd, alleen voor deze run
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_kikv
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_kikv_validator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_kikv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_kikv:test_password@localhost:5432/test_kikv_validator
      JWT_SECRET_KEY: ci-test-secret-key-not-used-in-production-32x
      RHADIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zet Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installeer dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Voer tests uit
        working-directory: backend
        run: pytest tests/ --tb=short -v

      - name: Voer tests uit met coverage (optioneel)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pytest-cov coverage --upgrade
          pytest tests/ \
            --tb=no \
            --cov=app \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  build-check:
    name: Docker build check (smoke test)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stel Docker Buildx in
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (geen push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: rhadix-backend:ci-check
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      - name: Build frontend image (geen push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          build-args: VITE_API_URL=
          tags: rhadix-frontend:ci-check
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
