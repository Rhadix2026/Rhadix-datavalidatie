name: Deploy — Production

# ─────────────────────────────────────────────────────────────────────────────
# Triggert bij een versie-tag op main (v*.*.*) OF handmatig via workflow_dispatch.
#
# VEILIGHEIDSMECHANISMEN:
#   1. Tests moeten slagen voordat deployment start
#   2. Verplichte handmatige goedkeuring via GitHub Environment 'production'
#      → Ga naar github.com/Rhadix2026/Rhadix-datavalidatie/deployments
#      → Klik "Review deployments" → Approve
#   3. Deploy gebruikt de exacte versie-tag, nooit :latest
#   4. Health check controleert productie na deployment
#   5. Rollback-instructies staan in DEPLOYMENT.md
#
# Vereiste GitHub Secrets (naast staging-secrets):
#   PROD_SSH_KEY         — SSH private key voor VPS
#   PROD_SSH_HOST        — IP van productie-server (bijv. 46.224.224.26)
#   PROD_SSH_USER        — SSH gebruiker (bijv. root)
#   PROD_DB_PASSWORD     — Productie-databasewachtwoord
#   PROD_LICENSE_KEY     — Productielijcentiesleutel
#   PROD_JWT_SECRET_KEY  — JWT signing secret productie (aparte waarde van staging!)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Versie om te deployen (bijv. v1.4.22)"
        required: true
        type: string

env:
  REGISTRY:        ghcr.io
  BACKEND_IMAGE:   ghcr.io/rhadix2026/rhadix-backend
  FRONTEND_IMAGE:  ghcr.io/rhadix2026/rhadix-frontend

jobs:
  # ── Job 1: Tests — moet slagen voor deployment mag starten ───────────────
  test:
    name: Pytest — backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_kikv
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_kikv_validator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_kikv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_kikv:test_password@localhost:5432/test_kikv_validator
      JWT_SECRET_KEY: ci-test-secret-key-not-used-in-production-32x
      RHADIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zet Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installeer dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Voer tests uit
        working-directory: backend
        run: pytest tests/ --tb=short -v

  # ── Job 2: Build productie-images ────────────────────────────────────────
  build:
    name: Build & push productie-images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bepaal versie-tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Stel Docker Buildx in
        uses: docker/setup-buildx-action@v3

      - name: Login naar GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          no-cache: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          no-cache: true
          build-args: |
            VITE_API_URL=
            VITE_RHADIX_ENV=production
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

  # ── Job 3: Deploy naar productie (vereist handmatige goedkeuring) ─────────
  deploy:
    name: Deploy naar productie
    runs-on: ubuntu-latest
    needs: build
    environment: production   # ← VERPLICHTE REVIEWER ingesteld in GitHub Settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log productie-deployment
        run: |
          echo "════════════════════════════════════════"
          echo "  PRODUCTIE DEPLOYMENT"
          echo "  Versie:  ${{ needs.build.outputs.version }}"
          echo "  Door:    ${{ github.actor }}"
          echo "  Tijd:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "════════════════════════════════════════"

      - name: Kopieer docker-compose.prod.yml naar server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          source:   docker-compose.prod.yml
          target:   /opt/rhadix-app/

      - name: Deploy met automatische rollback bij mislukking
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          # Niet set -e hier — rollback-logica handelt fouten zelf af
          script: |
            VERSION="${{ needs.build.outputs.version }}"
            COMPOSE_CMD="docker compose -p rhadix-prod -f /opt/rhadix-app/docker-compose.prod.yml --env-file /opt/rhadix-app/.env.production"

            # ── Sla vorige versie op voor rollback ──────────────────────────────
            PREV_VERSION=$(docker inspect rhadix-backend \
              --format '{{.Config.Image}}' 2>/dev/null \
              | awk -F: '{print $NF}' || echo "")
            echo "Vorige versie: ${PREV_VERSION:-onbekend}"
            echo "Nieuwe versie: $VERSION"

            # ── Schrijf productie env-file ────────────────────────────────────
            cat > /opt/rhadix-app/.env.production << 'ENVEOF'
            GHCR_ORG=rhadix2026
            DB_USER=kikv
            DB_NAME=kikv_validator
            FRONTEND_PORT=5174
            BACKEND_PORT=8010
            ENVEOF

            echo "RHADIX_VERSION=$VERSION"                                    >> /opt/rhadix-app/.env.production
            echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}"               >> /opt/rhadix-app/.env.production
            echo "RHADIX_LICENSE_KEY=${{ secrets.PROD_LICENSE_KEY }}"        >> /opt/rhadix-app/.env.production
            echo "JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET_KEY }}"         >> /opt/rhadix-app/.env.production
            chmod 600 /opt/rhadix-app/.env.production

            # ── Login bij GHCR ────────────────────────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull nieuwe images VÓÓR containers stoppen ────────────────────
            # (bij pull-fout: containers blijven draaien, workflow faalt veilig)
            if ! $COMPOSE_CMD pull; then
              echo "✗ Pull mislukt — containers onaangeroerd, deploy afgebroken"
              exit 1
            fi

            # ── Start nieuwe versie ───────────────────────────────────────────
            $COMPOSE_CMD up -d --remove-orphans
            echo "Containers gestart, health check..."

            # ── Health check (90 seconden) ────────────────────────────────────
            HEALTHY=false
            for i in $(seq 1 18); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                http://localhost:8010/api/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                HEALTHY=true
                echo "✓ Productie bereikbaar na poging $i (HTTP 200)"
                break
              fi
              echo "  Poging $i/18 — HTTP $STATUS — wacht 5s..."
              sleep 5
            done

            # ── Geslaagd ──────────────────────────────────────────────────────
            if [ "$HEALTHY" = "true" ]; then
              echo ""
              echo "════════════════════════════════════════"
              echo "  ✓ DEPLOY GESLAAGD: $VERSION"
              echo "════════════════════════════════════════"
              $COMPOSE_CMD ps
              exit 0
            fi

            # ── ROLLBACK ──────────────────────────────────────────────────────
            echo ""
            echo "════════════════════════════════════════"
            echo "  ✗ HEALTH CHECK MISLUKT — AUTOMATISCHE ROLLBACK"
            echo "════════════════════════════════════════"
            echo "Backend logs (laatste 50 regels):"
            docker logs rhadix-backend --tail 50 || true

            if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$VERSION" ] && [ "$PREV_VERSION" != "latest" ]; then
              echo ""
              echo "Terugzetten naar: $PREV_VERSION"
              sed -i "s/RHADIX_VERSION=.*/RHADIX_VERSION=$PREV_VERSION/" /opt/rhadix-app/.env.production
              $COMPOSE_CMD up -d --remove-orphans
              sleep 15
              RB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                http://localhost:8010/api/health 2>/dev/null || echo "000")
              if [ "$RB_STATUS" = "200" ]; then
                echo "✓ Rollback naar $PREV_VERSION geslaagd — site is weer online"
              else
                echo "✗ Rollback ook mislukt (HTTP $RB_STATUS) — handmatige interventie nodig"
                echo "  Voer uit op server: cd /opt/rhadix-app && docker compose -p rhadix-prod -f docker-compose.prod.yml --env-file .env.production up -d"
              fi
            else
              echo "Geen bruikbare vorige versie voor rollback (was: ${PREV_VERSION:-leeg})"
            fi

            exit 1
