name: Deploy — Staging

# ─────────────────────────────────────────────────────────────────────────────
# Triggert ALLEEN bij push naar de 'staging' branch.
# Voert eerst CI-tests uit — deployment stopt als tests falen.
# Raakt productie NOOIT aan.
#
# Vereiste GitHub Secrets (zie DEPLOYMENT.md voor instructies):
#   STAGING_SSH_KEY      — SSH private key voor toegang tot de VPS
#   STAGING_SSH_HOST     — IP-adres van de VPS (bijv. 46.224.224.26)
#   STAGING_SSH_USER     — SSH gebruiker (bijv. root)
#   STAGING_DB_PASSWORD  — Wachtwoord voor de staging-database
#   STAGING_LICENSE_KEY  — Licentiecsleutel voor staging
#   STAGING_JWT_SECRET_KEY — JWT signing secret (genereer met: python -c "import secrets; print(secrets.token_hex(32))")
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - staging

env:
  REGISTRY:        ghcr.io
  BACKEND_IMAGE:   ghcr.io/rhadix2026/rhadix-backend
  FRONTEND_IMAGE:  ghcr.io/rhadix2026/rhadix-frontend
  DEPLOY_TAG:      staging

jobs:
  # ── Job 1: Tests ─────────────────────────────────────────────────────────────
  test:
    name: Pytest — backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_kikv
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_kikv_validator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_kikv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_kikv:test_password@localhost:5432/test_kikv_validator
      JWT_SECRET_KEY: ci-test-secret-key-not-used-in-production-32x
      RHADIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zet Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installeer dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Voer tests uit
        working-directory: backend
        run: pytest tests/ --tb=short -v

  # ── Job 2: Build & push :staging image ───────────────────────────────────────
  build:
    name: Build & push :staging images
    runs-on: ubuntu-latest
    needs: test  # Alleen als tests slagen
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stel Docker Buildx in
        uses: docker/setup-buildx-action@v3

      - name: Login naar GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend :staging
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:staging
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      - name: Build & push frontend :staging
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
            VITE_RHADIX_ENV=staging
            VITE_APP_VERSION=staging-${{ github.run_number }}
          tags: ${{ env.FRONTEND_IMAGE }}:staging
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

  # ── Job 3: Deploy naar staging server ────────────────────────────────────────
  deploy:
    name: Deploy naar staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging  # GitHub Environment (geen approval vereist voor staging)

    steps:
      - name: Checkout (voor docker-compose.staging.yml)
        uses: actions/checkout@v4

      - name: Kopieer docker-compose.staging.yml naar server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          source:   docker-compose.staging.yml
          target:   /opt/rhadix-app/

      - name: Schrijf .env.staging op server en deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            # ── Schrijf staging env-file (overschrijft vorige versie) ──────────
            # Secrets komen uit GitHub — nooit in Git opgeslagen
            #
            # VOLGORDE IS BEPALEND: bij een dubbele sleutel in een --env-file wint de
            # LAATSTE regel. Daarom staat de persistente server-config bovenaan en
            # komen de expliciete staging-waarden en secrets daarna: die winnen altijd.
            #
            # ISOLATIE: staging leest uitsluitend mail.staging.env, nooit het gedeelde
            # mail.env (dat ook door de productie-deploy wordt gelezen).
            : > /opt/rhadix-app/.env.staging
            chmod 600 /opt/rhadix-app/.env.staging

            # Eenmalige migratie: bestaat er nog geen staging-eigen mail-config, dan
            # die afsplitsen van het gedeelde bestand. Daarna zijn ze onafhankelijk.
            if [ ! -f /opt/rhadix-app/mail.staging.env ] && [ -f /opt/rhadix-app/mail.env ]; then
              cp /opt/rhadix-app/mail.env /opt/rhadix-app/mail.staging.env
              chmod 600 /opt/rhadix-app/mail.staging.env
              echo "mail.staging.env afgesplitst van gedeeld mail.env (eenmalig)"
            fi

            # ── Persistente staging-mailconfig als BASIS (laagste prioriteit) ──
            if [ -f /opt/rhadix-app/mail.staging.env ]; then
              cat /opt/rhadix-app/mail.staging.env >> /opt/rhadix-app/.env.staging
              echo "mail.staging.env toegevoegd als basis"
            else
              echo "LET OP: geen mail.staging.env — staging-mail blijft uit"
            fi

            # ── Expliciete staging-waarden (winnen van het serverbestand) ──────
            cat >> /opt/rhadix-app/.env.staging << 'ENVEOF'
            GHCR_ORG=rhadix2026
            STAGING_DB_USER=kikv_staging
            STAGING_DB_NAME=kikv_staging
            STAGING_FRONTEND_PORT=5175
            STAGING_BACKEND_PORT=8011
            SSO_COOKIE_DOMAIN=.rhadix.nl
            PUBLIC_BASE_URL=https://app-staging.rhadix.nl
            # NB: AUTH_RESET wordt bewust NIET gezet. De compose geeft die variabele
            # niet door aan de backend, dus de code-default (1) geldt en de platform-
            # admin wordt bij elke start geborgd uit RHADIX_ADMIN_PASSWORD. Een waarde
            # in de persistente server-config kan de container hierdoor niet bereiken.
            ENVEOF

            # Voeg secrets toe (apart, zodat ze niet in bash history staan)
            echo "STAGING_DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}" >> /opt/rhadix-app/.env.staging
            echo "STAGING_LICENSE_KEY=${{ secrets.STAGING_LICENSE_KEY }}" >> /opt/rhadix-app/.env.staging
            echo "STAGING_JWT_SECRET_KEY=${{ secrets.STAGING_JWT_SECRET_KEY }}" >> /opt/rhadix-app/.env.staging
            # Centrale identiteit (SureSync ID): RS256-privésleutel (base64). Leeg = RS256 uit.
            echo "STAGING_JWT_PRIVATE_KEY=${{ secrets.STAGING_JWT_PRIVATE_KEY }}" >> /opt/rhadix-app/.env.staging
            # Platform-admin: verplicht (compose faalt hard als deze ontbreekt)
            echo "STAGING_ADMIN_PASSWORD=${{ secrets.STAGING_ADMIN_PASSWORD }}" >> /opt/rhadix-app/.env.staging

            # Beveilig het env-bestand (alleen root leesbaar)
            chmod 600 /opt/rhadix-app/.env.staging

            # ── Login bij GHCR ──────────────────────────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull nieuwste :staging images ───────────────────────────────────
            docker compose -p rhadix-staging \
              -f /opt/rhadix-app/docker-compose.staging.yml \
              --env-file /opt/rhadix-app/.env.staging \
              pull

            # ── Start/herstart staging stack ────────────────────────────────────
            docker compose -p rhadix-staging \
              -f /opt/rhadix-app/docker-compose.staging.yml \
              --env-file /opt/rhadix-app/.env.staging \
              up -d --remove-orphans

            echo "✓ Staging deployment klaar"
            docker compose -p rhadix-staging \
              -f /opt/rhadix-app/docker-compose.staging.yml \
              --env-file /opt/rhadix-app/.env.staging \
              ps

      - name: Health check staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            echo "Wacht op backend health check (http://localhost:8011/api/health)..."
            for i in $(seq 1 18); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8011/api/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✓ Backend staging bereikbaar (HTTP $STATUS)"
                docker ps --filter "name=rhadix-staging" --format "  {{.Names}}: {{.Status}}"
                exit 0
              fi
              echo "  Poging $i/18 — HTTP $STATUS — wacht 5s..."
              sleep 5
            done
            echo "✗ Health check mislukt na 90s — container logs:"
            docker logs rhadix-staging-backend --tail 30 || true
            exit 1
