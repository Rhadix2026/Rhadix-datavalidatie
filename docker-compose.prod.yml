# Rhadix — Productie docker-compose
# Gebruik: docker compose -f docker-compose.prod.yml up -d
#
# Vereist een .env bestand met de onderstaande variabelen.
# Zie .env.example voor een sjabloon.

services:

  db:
    image: postgres:16-alpine
    container_name: rhadix-db
    restart: always
    environment:
      POSTGRES_USER:     ${DB_USER:-kikv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Stel DB_PASSWORD in in .env}
      POSTGRES_DB:       ${DB_NAME:-kikv_validator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kikv} -d ${DB_NAME:-kikv_validator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_ORG}/rhadix-backend:${RHADIX_VERSION:-latest}
    container_name: rhadix-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      fuseki:
        condition: service_started
    environment:
      DATABASE_URL:        postgresql://${DB_USER:-kikv}:${DB_PASSWORD}@db:5432/${DB_NAME:-kikv_validator}
      JWT_SECRET_KEY:      ${JWT_SECRET_KEY:?Stel JWT_SECRET_KEY in als GitHub Secret / .env}
      JWT_PRIVATE_KEY:     ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY:      ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER:          ${JWT_ISSUER:-suresync-id}
      SSO_COOKIE_DOMAIN:   ${SSO_COOKIE_DOMAIN:-.rhadix.nl}
      RHADIX_LICENSE_KEY:  ${RHADIX_LICENSE_KEY:?Licentiesleutel verplicht — zie .env}
      FUSEKI_URL:          http://fuseki:3030
      FUSEKI_DATASET:      rhadix
      FUSEKI_USER:         admin
      FUSEKI_PASSWORD:     ${FUSEKI_PASSWORD:-rhadix-prod-admin}
      # E-mail (taaknotificaties) — standaard uit; waarden uit /opt/rhadix-app/mail.env
      MAIL_ENABLED:    ${MAIL_ENABLED:-false}
      SMTP_HOST:       ${SMTP_HOST:-}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USER:       ${SMTP_USER:-}
      SMTP_PASSWORD:   ${SMTP_PASSWORD:-}
      SMTP_FROM:       ${SMTP_FROM:-noreply@rhadix.nl}
      SMTP_FROM_NAME:  ${SMTP_FROM_NAME:-Rhadix}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - rhadix_profiles:/app/data/profiles
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: ghcr.io/${GHCR_ORG}/rhadix-frontend:${RHADIX_VERSION:-latest}
    container_name: rhadix-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5174}:80"

  fuseki:
    image: stain/jena-fuseki:5.1.0
    container_name: rhadix-fuseki
    restart: always
    environment:
      ADMIN_PASSWORD:   ${FUSEKI_PASSWORD:-rhadix-prod-admin}
      FUSEKI_DATASET_1: rhadix
      JVM_ARGS:         -Xmx512m
    volumes:
      - fuseki_data:/fuseki
    # Geen externe poort — alleen intern Docker-netwerk

  # ── Watchtower verwijderd ────────────────────────────────────────────────
  # Deployments worden beheerd via GitHub Actions (deploy-production.yml).
  # Automatische image-updates via Watchtower veroorzaakten ongewenste
  # herstarts met verkeerde image-tags.

volumes:
  pgdata:
    name: rhadix_pgdata
    external: true
  rhadix_profiles:
    name: rhadix_profiles
    external: true
  fuseki_data:
    name: rhadix_fuseki
