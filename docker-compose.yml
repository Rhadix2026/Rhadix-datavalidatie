services:
  db:
    image: postgres:16-alpine
    container_name: rhadix-v131-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kikv
      POSTGRES_PASSWORD: kikv
      POSTGRES_DB: kikv_validator
    volumes:
      - pgdata_v131:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kikv -d kikv_validator"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: rhadix-v131-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      fuseki:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://kikv:kikv@db:5432/kikv_validator
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_DATASET: rhadix
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: rhadix-admin
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    container_name: rhadix-v131-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

  fuseki:
    image: stain/jena-fuseki:5.1.0
    container_name: rhadix-v131-fuseki
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: rhadix-admin
      FUSEKI_DATASET_1: rhadix
      JVM_ARGS: -Xmx512m
    volumes:
      - fuseki_v131:/fuseki
    ports:
      - "3030:3030"   # lokaal toegankelijk voor debugging

volumes:
  pgdata_v131:
    name: rhadix_v131_pgdata
  fuseki_v131:
    name: rhadix_v131_fuseki
