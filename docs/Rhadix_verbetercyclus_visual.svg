<svg viewBox="0 0 780 490" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" role="img">
<title>De verbetercyclus met Rhadix</title>
<desc>Rhadix meet de datakwaliteit bij de nulmeting en de herhaalmeting van de verbetercyclus; scoort per veld op volledig, juist, eenduidig en tijdig; bruikbaar op mbo- en hbo-niveau.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5F5E5A"/></marker>
</defs>

<!-- Rhadix meetinstrument -->
<rect x="280" y="18" width="220" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="390" y="42" text-anchor="middle" font-size="17" font-weight="bold" fill="#3C3489">Rhadix</text>
<text x="390" y="62" text-anchor="middle" font-size="12.5" fill="#534AB7">meet de datakwaliteit</text>

<!-- dashed measure links -->
<path d="M340,78 L172,148" stroke="#534AB7" stroke-width="1.3" stroke-dasharray="4 4" fill="none"/>
<path d="M440,78 L620,148" stroke="#534AB7" stroke-width="1.3" stroke-dasharray="4 4" fill="none"/>
<text x="238" y="116" text-anchor="middle" font-size="11" fill="#534AB7">meet</text>
<text x="548" y="116" text-anchor="middle" font-size="11" fill="#534AB7">meet</text>

<!-- cycle boxes -->
<rect x="48" y="150" width="196" height="72" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="146" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F6E56">Nulmeting</text>
<text x="146" y="203" text-anchor="middle" font-size="12" fill="#0F6E56">waar staan we nu?</text>

<rect x="292" y="150" width="196" height="72" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="390" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F6E56">Verbeteractie</text>
<text x="390" y="203" text-anchor="middle" font-size="12" fill="#0F6E56">een SMART-actie</text>

<rect x="536" y="150" width="196" height="72" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
<text x="634" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F6E56">Herhaalmeting</text>
<text x="634" y="203" text-anchor="middle" font-size="12" fill="#0F6E56">is het beter?</text>

<!-- horizontal arrows -->
<line x1="248" y1="186" x2="286" y2="186" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="492" y1="186" x2="530" y2="186" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>

<!-- return arrow (cycle repeats) -->
<path d="M634,222 L634,258 Q634,268 624,268 L156,268 Q146,268 146,258 L146,226" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="390" y="285" text-anchor="middle" font-size="11.5" fill="#5F5E5A">de cyclus herhaalt — meet, verbeter, meet opnieuw</text>

<!-- dimensions -->
<text x="390" y="330" text-anchor="middle" font-size="12.5" fill="#52514e">Rhadix scoort per gegevensveld op:</text>
<g font-size="12.5" font-weight="bold" fill="#444441">
<rect x="120" y="342" width="132" height="34" rx="17" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="186" y="364" text-anchor="middle">Volledig</text>
<rect x="264" y="342" width="120" height="34" rx="17" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="324" y="364" text-anchor="middle">Juist</text>
<rect x="396" y="342" width="132" height="34" rx="17" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="462" y="364" text-anchor="middle">Eenduidig</text>
<rect x="540" y="342" width="120" height="34" rx="17" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/><text x="600" y="364" text-anchor="middle">Tijdig</text>
</g>

<!-- mbo / hbo lens -->
<rect x="48" y="404" width="330" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="213" y="428" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2C2C2A">mbo</text>
<text x="213" y="448" text-anchor="middle" font-size="12" fill="#5F5E5A">herkennen &amp; corrigeren</text>

<rect x="402" y="404" width="330" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="567" y="428" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2C2C2A">hbo</text>
<text x="567" y="448" text-anchor="middle" font-size="12" fill="#5F5E5A">analyseren &amp; adviseren</text>
</svg>
