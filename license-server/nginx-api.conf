# api.rhadix.nl — licentieserver
server {
    listen 80;
    server_name api.rhadix.nl;

    location / {
        proxy_pass         http://127.0.0.1:8100;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8100/health;
    }
}

# rhadix.nl — landingspagina
server {
    listen 80;
    server_name rhadix.nl www.rhadix.nl;
    root /var/www/rhadix;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# app.rhadix.nl — cloud demo omgeving
server {
    listen 80;
    server_name app.rhadix.nl;

    location /api/ {
        proxy_pass         http://127.0.0.1:8010/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass         http://127.0.0.1:5174;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
